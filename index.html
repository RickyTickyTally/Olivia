<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;900display=swap" rel="stylesheet">
    <link rel="icon" href="assets/Favicon.png" type="image/png">
    <link rel="stylesheet" href="index.css">
    <title>Document</title>
</head>
<body>
    <header class="header" aria-label="header section">
        <div class="container">
            <div class="header__wrapper" aria-label="header wrapper">
                <div class="logo">
                    <img src="assets/Logo.png" alt="web logo">
                </div>

                <nav class="header__nav" aria-label="menu navigation">
                    <ul class="header__nav-list" aria-label="menu list">
                        <li class="header_nav-item" aria-label="meni item">
                            <a href="#" class="header__nav-link">Why alivio</a>
                        </li>
                        <li class="header_nav-item" aria-label="menu item">
                            <a href="#" class="header__nav-link">Solutions</a>
                        </li>
                        <li class="header_nav-item" aria-label="menu item">
                            <a href="#" class="header__nav-link">Community</a>
                        </li>
                        <li class="header_nav-item" aria-label="menu item">
                            <a href="#" class="header__nav-link">Pricing</a>
                        </li>
                    </ul>
                </nav>

                <div class="header__actions" aria-label="header actions">
                    <button type="button" class="btn btn--signin" aria-label="authorization button">Sign In</button>
                    <button type="button" class="btn" aria-label="trial authorization button">Sign Trial</button>
                </div>
            </div>
        </div>
    </header>
    <main>
        <section class="hero" aria-label="hero section">
            <div class="container">
                <div class="hero__content" aria-label="hero section content">
                    <h1 class="hero__title" aria-label="hero title">Be aware, Manage well.</h1>
                    <p class="hero__description" aria-label="hero description">Everyone experiences stress in different ways.Let Alivio guide you, in a personalized journal experience, to overcome your stress.</p>
                    <button type="button" class="btn" aria-label="hero button">Find Your Way</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
